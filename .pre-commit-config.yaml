---
fail_fast: false
repos:
  - repo: https://github.com/pre-commit/pre-commit
    rev: v4.6.2
    hooks:
      - id: validate_manifest
        name: 🛠️ pre-commit · Validate pre-commit configuration
  - hooks:
      - id: check-case-conflict
        name: 🛠️ pre-commit · Check for case conflicts
      - id: check-merge-conflict
        name: 🛠️ pre-commit · Check for merge conflicts
      - id: check-yaml
        name: 🛠️ pre-commit · Check YAML files
      - id: end-of-file-fixer
        name: 🛠️ pre-commit · Fix end of file
      - id: mixed-line-ending
        name: 🛠️ pre-commit · Check mixed line endings
      - id: trailing-whitespace
        name: 🛠️ pre-commit · Check trailing whitespace
      - id: check-json
        name: 🛠️ pre-commit · Check JSON files
      - id: check-added-large-files
        name: 🛠️ pre-commit · Check for large files
        args: ["--maxkb=2000"]
      - id: check-xml
        name: 🛠️ pre-commit · Check XML files
      - id: check-toml
        name: 🛠️ pre-commit · Check TOML files
      - args: ["--autofix", "--indent=4"]
        name: 🛠️ pre-commit · Check and fix JSON files
        id: pretty-format-json
    repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
  - hooks:
      - id: gitleaks
        name: 🔒 security · Detect hardcoded secrets
    repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
  - hooks:
      - additional_dependencies:
          - validate-pyproject-schema-store[all]
        id: validate-pyproject
        name: 🐍 validate-pyproject · Validate pyproject.toml
    repo: https://github.com/abravalheri/validate-pyproject
    rev: "0.26"
  - repo: https://github.com/myint/eradicate
    rev: 3.0.1
    hooks:
      - id: eradicate
        args: []
        name: 🐍 eradicate · Remove dead code
  - hooks:
      - args: [--fix, --config, ./pyproject.toml, --unsafe-fixes]
        id: ruff-check
        name: 🐍 ruff · Check Python code
        exclude: ^(_not_posted/)
      - id: ruff-format
        name: 🐍 ruff · Format Python code
    repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.7
  - repo: https://github.com/rvben/rumdl-pre-commit
    rev: v0.2.75
    hooks:
      - id: rumdl-fmt
        name: 📝 rumdl · Format Markdown and Quarto files
        types: [text]
        files: \.(md|qmd)$
        exclude: ^(_not_posted/|_freeze/|_site/)
        additional_dependencies:
          - ruff>=0.16.7

  - repo: local
    hooks:
      - id: pyrefly
        name: 🐍 pyrefly · Type check Python code
        entry: uv run pyrefly check
        language: system
        pass_filenames: false
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        name: 🎨 prettier · Format CSS & SCSS
        alias: prettier-css
        types_or: [css, scss]
        files: ^css/
      - id: prettier
        name: 🎨 prettier · Format YAML files
        alias: prettier-yaml
        types: [yaml]
        exclude: ^(_extensions/|_site/|_freeze/|\.venv/)

  - repo: https://github.com/ComPWA/taplo-pre-commit
    rev: v0.9.3
    hooks:
      - id: taplo-format
        name: ⚙️ taplo · Format TOML files

  - hooks:
      - id: uv-lock
        name: 🐍 uv · Lock dependencies
    repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.5
