[project]
    authors = [
        { name = "bwrob", email = "bartosz.marcin.wroblewski@gmail.com" },
    ]
    dependencies = [
        "backports.strenum>=1.0.2,<2",
        "basedpyright>=1.31.7",
        "debug-dojo>=0.6.0",
        "ipython>=9.6.0",
        "jupyter-cache>=1.0.1",
        "jupyter>=1.1.1",
        "matplotlib>=3.10.3,<4",
        "monkeytype>=23.3.0",
        "mplcyberpunk>=0.7.6",
        "numba>=0.62.1",
        "numpy>=2.3.3",
        "pandas-stubs>=2.3.0.250703,<3",
        "pandas>=2.3.1,<3",
        "perfplot>=0.10.2",
        "plotly>=6.2.0,<7",
        "polars>=1.39.3",
        "psutil>=7.2.2",
        "pyarrow>=23.0.1",
        "pydantic>=2.11.7,<3",
        "pytype>=2024.10.11",
        "rich>=14.0.0,<15",
        "scipy>=1.16.0,<2",
        "seaborn>=0.13.2",
        "sympy>=1.14.0,<2",
]
    description = "Personal blog about programming, finance, and physics."
    name = "bwrob-github-io"
    readme = "README.md"
    requires-python = ">=3.11"
    version = "0.1.0"


[tool.uv]
    package = false

[tool.poe.tasks]

    _check       = "ruff check --config ruff.toml ."
    _fix_lint    = "ruff check --fix --unsafe-fixes --config ruff.toml ."
    _format      = "ruff format --config ruff.toml ."
    _hap_preview = "hap run quarto preview ./index.qmd --port 3333"
    _hap_publish = "hap run quarto publish --no-prompt --no-browser gh-pages"
    _pre_commit  = "pre-commit run --all-files"
    _report_host = "echo 'http://localhost:3333/'"
    _type_check  = "basedpyright ."
    clean_tree   = "git worktree list | grep -v quarto-main | awk '{print $1}' | xargs git worktree remove"

    preview = ["_hap_preview", "_report_host"]
    publish = ["_pre_commit", "_hap_publish"]
