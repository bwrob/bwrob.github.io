[project]
    name = "bwrob-github-io"
    version = "0.1.0"
    description = ""
    authors = [
        { name = "bwrob", email = "bartosz.marcin.wroblewski@gmail.com" },
    ]
    requires-python = ">=3.13"
    readme = "README.md"
    dependencies = [
        "jupyter>=1.1.1",
        "matplotlib>=3.10.3,<4",
        "pandas-stubs>=2.3.0.250703,<3",
        "pandas>=2.3.1,<3",
        "plotly>=6.2.0,<7",
        "pydantic>=2.11.7,<3",
        "pygame>=2.6.1,<3",
        "rich>=14.0.0,<15",
        "scipy>=1.16.0,<2",
        "sympy>=1.14.0,<2",
    ]


[tool.uv]
    package = false

[tool.poe.tasks]

    _report_host = "echo 'http://localhost:3333/'"
    _hap_preview = "hap run quarto preview ./index.qmd --port 3333 --quiet"
    _fix         = "ruff check --fix --unsafe-fixes --config ruff.toml ."
    _format      = "ruff format --config ruff.toml ."

    preview = ["_hap_preview", "_report_host"]
    publish = "hap run quarto publish --no-prompt --no-browser --quiet  gh-pages"
    check   = ["_fix", "_format"]
