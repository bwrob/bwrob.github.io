[project]
    authors = [
        { name = "bwrob", email = "bartosz.marcin.wroblewski@gmail.com" },
    ]
    dependencies = [
        "backports.strenum>=1.0.2,<2",
        "basedpyright>=1.31.7",
        "jupyter>=1.1.1",
        "matplotlib>=3.10.3,<4",
        "mplcyberpunk>=0.7.6",
        "numba>=0.62.1",
        "numpy>=2.3.3",
        "pandas-stubs>=2.3.0.250703,<3",
        "pandas>=2.3.1,<3",
        "perfplot>=0.10.2",
        "plotly>=6.2.0,<7",
        "pydantic>=2.11.7,<3",
        "pygame>=2.6.1,<3",
        "rich>=14.0.0,<15",
        "scipy>=1.16.0,<2",
        "seaborn>=0.13.2",
        "sympy>=1.14.0,<2",
]
    description = "Personal blog about programming, finance, and physics."
    name = "bwrob-github-io"
    readme = "README.md"
    requires-python = ">=3.11"
    version = "0.1.0"


[tool.uv]
    package = false

[tool.poe.tasks]

    _check       = "ruff check --config ruff.toml ."
    _fix         = "ruff check --fix --unsafe-fixes --config ruff.toml ."
    _format      = "ruff format --config ruff.toml ."
    _hap_preview = "hap run quarto preview ./index.qmd --port 3333"
    _report_host = "echo 'http://localhost:3333/'"
    _type_check  = "basedpyright ."

    preview = ["_hap_preview", "_report_host"]
    publish = "hap run quarto publish --no-prompt --no-browser gh-pages"

    [tool.poe.tasks.check]
        ignore_fail = "return_zero"
        sequence = [
            "_fix",
            "_format",
            "_check",
            "_type_check",
        ]
