[project]
    dependencies = [
        "jupyter-cache>=1.0.1",
        "jupyter>=1.1.1",
        "matplotlib>=3.10.3,<4",
        "numba>=0.62.1",
        "numpy>=2.3.3",
        "pandas-stubs>=2.3.0.250703",
        "pandas>=2.3.1",
        "perfplot>=0.10.2",
        "plotly>=6.2.0",
        "polars>=1.39.3",
        "pydantic>=2.11.7,<3",
        "pyrefly>=1.3.1",
        "rich>=14.0.0,<15",
        "ruff>=0.16.7",
        "rumdl>=0.2.73",
        "scipy>=1.16.0,<2",
        "seaborn>=0.13.2",
        "sympy>=1.14.0,<2",
        "yfinance>=1.3.0",
    ]
    name = "bwrob-github-io"
    requires-python = ">=3.13"
    version = "0.1.0"


[tool.uv]
    package = false

[tool.poe]
    include = "poe_tasks.toml"

[tool.ruff]
    exclude        = ["_not_posted/"]
    line-length    = 88
    target-version = "py313"

    [tool.ruff.lint]
        ignore = ["COM", "D203", "D211", "D213", "FA", "ISC", "T", "TC", "CPY001"]
        select = ["ALL"]

    [tool.ruff.format]
        docstring-code-format = true


[tool.rumdl]
    exclude = [
        ".git",
        ".github",
        ".venv",
        ".ruff_cache",
        ".rumdl_cache",
        ".temp",
        "_not_posted",
        "_site",
        "_freeze",
    ]
    flavor = "quarto"
    line-length = 88
    respect-gitignore = true

    # --- Code Block Tools (Format & Lint Python & JSON in QMD) ---
    [tool.rumdl.code-block-tools]
        enabled                = true
        on-error               = "warn"
        on-missing-tool-binary = "warn"

        [tool.rumdl.code-block-tools.language-aliases]
            "bash"     = "shell"
            "python3"  = "python"
            "{bash}"   = "shell"
            "{json}"   = "json"
            "{python}" = "python"

        [tool.rumdl.code-block-tools.languages.python]
            format = ["ruff:format"]
            lint   = ["ruff:check"]

        [tool.rumdl.code-block-tools.languages.json]
            format = ["jq"]

        [tool.rumdl.code-block-tools.tools."ruff:check"]
            command = [
                "ruff",
                "check",
                "--output-format=concise",
                "--ignore=INP001,F821,D,ANN,FBT,E402,B018,S101",
                "-",
            ]

    # --- Rigid Markdown Rules ---
    [tool.rumdl.MD001]
        front-matter-title = true

    [tool.rumdl.MD003]
        style = "atx"

    [tool.rumdl.MD004]
        style = "dash"

    [tool.rumdl.MD007]
        indent = 2

    [tool.rumdl.MD009]
        strict = true

    [tool.rumdl.MD010]
        code-blocks = true

    [tool.rumdl.MD012]
        maximum = 1

    [tool.rumdl.MD013]
        code-blocks = false
        headings    = false
        line-length = 88
        math-blocks = false
        reflow      = true
        tables      = false

    [tool.rumdl.MD022]
        lines-above = 1
        lines-below = 1

    [tool.rumdl.MD026]
        punctuation = ".,;:!"

    [tool.rumdl.MD031]
        list-items = true

    [tool.rumdl.MD033]
        allowed-elements = [
            "a",
            "audio",
            "br",
            "details",
            "div",
            "i",
            "iframe",
            "img",
            "kbd",
            "span",
            "sub",
            "summary",
            "sup",
            "table",
            "tbody",
            "td",
            "th",
            "thead",
            "tr",
            "video",
        ]

    [tool.rumdl.MD035]
        style = "---"

    [tool.rumdl.MD044]
        code-blocks = false
        names = [
            "AWS",
            "Docker",
            "GitHub",
            "JavaScript",
            "Jupyter",
            "Linux",
            "Pandas",
            "Polars",
            "Python",
            "Quarto",
            "Ruff",
            "macOS",
            "rumdl",
        ]

    [tool.rumdl.MD046]
        style = "fenced"

    [tool.rumdl.MD048]
        style = "backtick"

    [tool.rumdl.MD049]
        style = "asterisk"

    [tool.rumdl.MD050]
        style = "asterisk"

    [tool.rumdl.MD058]
        minimum-after  = 1
        minimum-before = 1

    [tool.rumdl.MD059]
        prohibited-texts = ["click here", "here", "link", "read more"]

    [tool.rumdl.MD060]
        enabled = true
        style   = "aligned"

    # --- Per-file rule ignores for landing/utility pages & templates ---
    [tool.rumdl.per-file-ignores]
        ".agents/skills/create-post-stub/resources/post-template.qmd" = ["MD057"]
        "404.qmd"                                                     = ["MD041"]
        "hobbies/index.qmd"                                           = ["MD041"]
        "index.qmd"                                                   = ["MD041"]
        "resume/index.qmd"                                            = ["MD036"]
