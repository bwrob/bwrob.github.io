[project]
    dependencies = [
        "jupyter-cache>=1.0.1",
        "jupyter>=1.1.1",
        "matplotlib>=3.10.3,<4",
        "numba>=0.62.1",
        "numpy>=2.3.3",
        "pandas-stubs>=2.3.0.250703",
        "pandas>=2.3.1",
        "perfplot>=0.10.2",
        "plotly>=6.2.0",
        "polars>=1.39.3",
        "pydantic>=2.11.7,<3",
        "rich>=14.0.0,<15",
        "scipy>=1.16.0,<2",
        "seaborn>=0.13.2",
        "sympy>=1.14.0,<2",
        "yfinance>=1.3.0",
    ]
    name = "bwrob-github-io"
    requires-python = ">=3.13"
    version = "0.1.0"


[tool.uv]
    package = false

[tool.poe]
    include = "poe_tasks.toml"

[tool.ruff]
    exclude        = ["_not_posted/"]
    line-length    = 88
    target-version = "py313"

    [tool.ruff.lint]
        ignore = ["COM", "D203", "D211", "D213", "FA", "ISC", "T", "TC", "CPY001"]
        select = ["ALL"]

    [tool.ruff.format]
        docstring-code-format = true
