project:
  type: website
  output-dir: _site
  resources:
    - "assets/"

website:
  title: "bwrob blog"
  site-url: "https://bwrob.github.io"
  description: "Personal blog about programming, finance, and physics."

  favicon: assets/logo/python_mug.png
  twitter-card:
    title: "bwrob blog"
    description: "bwrob personal and professional blog"
    image: assets/logo/python_mug.png
    card-style: summary_large_image

  open-graph:
    title: "bwrob blog"
    description: "bwrob personal and professional blog"
    image: assets/logo/python_mug.png
    site-name: "bwrob blog"

  image: assets/logo/python_mug.png

  page-navigation: true
  back-to-top-navigation: true
  page-footer: "Copyright 2026, bwrob. Rendered with Quarto {{< version >}}"
  draft-mode: unlinked

  search:
    location: navbar
    type: overlay

  navbar:
    collapse: true
    pinned: true
    right:
      - text: "Posts"
        icon: cpu
        file: index.qmd
      - text: "Resume"
        icon: file-earmark-text
        file: pages/resume.qmd
      - text: "Teaching"
        icon: tablet-landscape
        file: pages/teaching.qmd
      - text: "Hobbies"
        icon: controller
        file: pages/hobbies.qmd
      - text: "debug dojo"
        icon: bug-fill
        href: https://bwrob.github.io/debug-dojo/
      - text: "sus inspector"
        icon: bug-fill
        href: https://bwrob.github.io/sus-inspector/
      - icon: linkedin
        href: https://www.linkedin.com/in/bartoszmwroblewski/
      - icon: github
        href: https://github.com/bwrob/
      - icon: rss
        href: index.xml
    logo: assets/logo/python_mug.png

format:
  html:
    theme:
      dark: [darkly, css/theme-dark.scss]
      light: flatly
    css: css/styles.css
    code-fold: show
    code-summary: "Show the code"
    code-overflow: wrap
    code-copy: true
