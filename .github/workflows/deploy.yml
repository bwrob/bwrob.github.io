name: Deploy Website

on:
  push:
    branches:
      - quarto-main
  pull_request:
    branches:
      - quarto-main

jobs:
  lint:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Check Python formatting (ruff)
        run: uv run ruff format --check .

      - name: Lint Python code (ruff)
        run: uv run ruff check .

      - name: Check Markdown formatting (rumdl)
        run: uv run rumdl fmt --check

      - name: Type check (pyrefly)
        run: uv run pyrefly check

      - name: Verify CNAME
        run: |
          test -f CNAME && [ "$(cat CNAME | tr -d '[:space:]')" = "bwrob.dev" ]

  publish:
    name: Publish to GitHub Pages
    needs: lint
    if: github.event_name == 'push' && github.ref == 'refs/heads/quarto-main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Verify CNAME configuration
        run: |
          if [ ! -f CNAME ] || [ "$(cat CNAME | tr -d '[:space:]')" != "bwrob.dev" ]; then
            echo "ERROR: CNAME file missing or invalid! Expected bwrob.dev"
            exit 1
          fi

      - name: Publish to GitHub Pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QUARTO_PYTHON: .venv/bin/python
